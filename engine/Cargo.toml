[package]
name = "likhi-engine"
version = "0.1.0"
edition = "2021"
description = "The Likhi suggestion engine: loose-romanization Bangla candidate generation and ranking"
license = "MIT"
publish = false

# A library plus the server binary that wraps it. The split is so the golden tests can drive the
# engine directly, without a socket in the way.
[lib]
name = "likhi_engine"
path = "src/lib.rs"

[[bin]]
name = "likhi-server"
path = "src/bin/server.rs"

# The lexicon builder. A developer tool, not part of the product, so its dependencies -- gzip and a
# CSV reader, needed only to read the source corpora -- are optional and the `build` feature is off
# by default. Nothing here reaches the engine that ships.
[[bin]]
name = "likhi-lexicon"
path = "src/bin/lexicon.rs"
required-features = ["build"]

[features]
build = ["dep:flate2", "dep:csv"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The lexicon tables and model weights are mapped, not read: together they are ~120 MB, and an
# engine that sits in the background all day should not hold that in resident memory. Mapping lets
# the OS page in only what a lookup touches and evict it again under pressure.
memmap2 = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
# NFC. The Bengali rules in textnorm depend on canonical composition behaving exactly as Python's
# unicodedata does, including decomposing the three nukta letters, which are composition exclusions.
unicode-normalization = "0.1"

# Used only by the lexicon builder (feature "build"). flate2's pure-Rust backend on purpose: the
# builder should not need a C toolchain beyond what the rest of the crate already does.
flate2 = { version = "1", optional = true, default-features = false, features = ["rust_backend"] }
csv = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    # Telemetry upload. WinHTTP rather than a Rust TLS stack: it is already on every Windows
    # machine, it uses the system certificate store (so a managed network's proxy and inspection
    # just work), and it keeps rustls and ring out of a binary that ships to end users.
    "Win32_Networking_WinHttp",
] }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3       # unlike the shell, this crate's whole job is arithmetic
lto = true
codegen-units = 1
panic = "abort"
strip = true
