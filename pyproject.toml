# Python is no longer the product. The engine, the shell and every developer tool are Rust, under
# `engine/` and `shell/`; this file now describes only what is left:
#
#   scripts/   data preparation and build orchestration, run on a developer machine
#   server/    the ingest service, which runs in a container
#   tests/     what is left to test in Python: the ingest server, the PIME key map, file encodings
#
# There is no importable `likhi` package any more and nothing here is published to PyPI, so this is
# a configuration file for the tools rather than a package definition.

[project]
name = "likhi-tools"
version = "0.0.1"
description = "Developer tooling for Likhi: data preparation, build orchestration and the telemetry ingest service. The engine and shell are Rust, under engine/ and shell/."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Khaled Bin Amir" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Private :: Do Not Upload",
]
dependencies = []

[project.optional-dependencies]
# Preparing the model and the lexicon source data. NumPy does the weight conversion, whose output
# is written into the blob the engine maps, so the arithmetic happens here once rather than at
# every startup.
data = [
  "numpy>=1.26",
  "regex>=2024.0",
  "huggingface_hub>=0.24",
  "avro.py>=2024.0",
]
# The deployed ingest service. Running it locally with --data needs nothing at all; this is only
# for the Cloud Run deployment.
server = ["google-cloud-storage>=2.18"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]
# One-time model conversion (IndicXlit fairseq checkpoint -> CTranslate2). Never shipped to users.
# torch is deliberately not required: scripts/fairseq_ckpt.py reads the checkpoint with numpy.
convert = ["omegaconf>=2.3"]

[project.urls]
Homepage = "https://github.com/KhaledBinAmir/likhi"
Issues = "https://github.com/KhaledBinAmir/likhi/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Nothing is packaged: there is no library here, only scripts run from a checkout.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["tests", "scripts", "server"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
