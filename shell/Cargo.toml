[package]
name = "likhi-tsf"
version = "0.1.0"
edition = "2021"
description = "Likhi text service: a Windows Text Services Framework keyboard that speaks to the Likhi engine"
license = "MIT"
publish = false

# A COM in-process server. cdylib gives a plain DLL with C-callable exports and no Rust metadata,
# which is what regsvr32 and the Text Services Framework expect to load into every application.
# rlib alongside it so `cargo test` can link the crate; it changes nothing about the DLL produced.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Microsoft's own Win32 / COM bindings. The `implement` macro (from windows-core, re-exported as
# windows::core::implement) generates the COM vtables for our text service, which is the boilerplate
# that makes hand-written C++ TSF code so long.
windows = { version = "0.62", features = [
    "Foundation_Numerics",   # D2D_POINT_2F is an alias for Vector2
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_SystemServices",
    "Win32_System_Threading",     # the engine pipe: session id, event, timed wait
    "Win32_Storage_FileSystem",   # ... opening and reading that pipe
    "Win32_System_IO",            # ... overlapped I/O, so a read can have a deadline
    "Win32_System_Pipes",         # ... and waiting when every pipe instance is busy
    "Win32_System_RemoteDesktop", # ... ProcessIdToSessionId lives here, not under Threading
    "Win32_System_Variant",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_TextServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
] }
windows-core = "0.62"
# Direct2D points and sizes are Vector2 from here; windows 0.62 has no D2D_POINT_2F alias.
windows-numerics = "0.3"
# The engine protocol is JSON lines, over a named pipe where possible and a local socket otherwise;
# the wire format is unchanged from the PIME shell, so the Python engine keeps working.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"     # size over speed: this sits in every process; the work is in the engine
lto = true
codegen-units = 1
panic = "abort"     # a panic must never unwind across the COM boundary into a host application
strip = true
